## Settings file was created by plugin The NOexistenceN of you AND me 无障碍朗读 v0.0.0
## Plugin GUID: noexistence.a11y

[界面导航]

## 按 Tab 进入/退出导航模式，方向键选项，回车/空格激活。
## 覆盖主菜单、设置、存档、选项框、标题画面等所有界面。
# Setting type: Boolean
# Default value: true
启用键盘导航 = true

## 关掉的话会把隐藏面板里的控件也扫进来，通常只会造成噪声。
# Setting type: Boolean
# Default value: true
只导航画面上可见的控件 = true

## 关掉则按渲染层级排序。默认按位置更符合直觉。
# Setting type: Boolean
# Default value: true
按屏幕位置排序 = true

## 「退出游戏」只按一下就关掉整个会话，而读屏用户分不清它和旁边的按钮，所以补一道确认。
# Setting type: Boolean
# Default value: true
退出前二次确认 = true

## 逗号分隔的 GameObject 名。只有名字精确命中的按钮才需要二次确认。
# Setting type: String
# Default value: ExitButton,QuitGame,ExitGameButton,QuitButton
退出按钮对象名 = ExitButton,QuitGame,ExitGameButton,QuitButton

## 逗号分隔的路径片段，命中就不纳入导航。
## 默认排掉的是 Naninovel 自带的**开发者工具**：
##   ScriptNavigatorUI —— 「直接跳转到任意剧本」面板。
##      实测踩过的坑：它能导航到「PlayScript: Title」这类原始剧本条目，
##      按下去会绕开正常流程把游戏扔进裸剧本，结果是黑屏+有音乐+无任何响应，
##      只能 Alt+F4。这不是游戏的问题，是我们不该让它可点。
##   ExternalScriptsBrowser / DebugInfoGUI / CustomVariableGUI —— 同类调试面板。
# Setting type: String
# Default value: ScriptNavigatorUI,ExternalScriptsBrowser,DebugInfoGUI,CustomVariableGUI,SaveLoadUI
排除的面板路径 = ScriptNavigatorUI,ExternalScriptsBrowser,DebugInfoGUI,CustomVariableGUI,SaveLoadUI

[朗读]

## 总开关。
# Setting type: Boolean
# Default value: true
启用 = true

## 命中配音白名单时只放游戏语音，不用 TTS 重复念一遍。
# Setting type: Boolean
# Default value: true
有配音时不再朗读 = true

## 朗读无配音台词前先报说话人名（如「国王：」）。旁白不报。
# Setting type: Boolean
# Default value: true
播报说话人 = true

## 莉莉丝系有多个名号（莉莉丝/莉莉丝公主/魔王莉莉丝/神秘少女）。
## 声音一样，但屏幕上换名字是重要剧情，所以在有配音时也念一遍名字。
# Setting type: Boolean
# Default value: true
有配音时也报名 = true

## 像「……」这种只有标点的行是否也读出来。默认不读。
# Setting type: Boolean
# Default value: false
朗读纯省略号 = false

## ★ 剧透闸门，强烈建议保持开启。
## RevealableText 是复用的，游戏会在面板还没显示时就把文本写进去
## （载入存档 / 加载场景 / 预载剧本都会）。只挂 set_Text 的话，
## 这些玩家根本看不到的文本会被念出来 —— 实测在 load 场景念出过结局文本。
## 开启后只朗读同时收到「开始打印」事件的行。
# Setting type: Boolean
# Default value: true
只朗读正在显示的行 = true

## 自动 / NVDA / Tolk / SAPI。填具体值可强制只用那一个（排查用）。
# Setting type: String
# Default value: 自动
语音后端 = 自动

[选项框]

## 主角的全部台词都在选项框里（全剧 ≥625 条），所以这块不是可选项。
## 每条选项出现时立刻带序号朗读。
# Setting type: Boolean
# Default value: true
朗读选项 = true

## 选项出现时按 1-9 直接选中对应项，不必用鼠标、也不必先按 Tab。
# Setting type: Boolean
# Default value: true
数字键直选 = true

[诊断]

## 把每一句的判定过程写进 BepInEx\noexistence_a11y.log。
# Setting type: Boolean
# Default value: true
详细日志 = true

## 测试用：引擎就绪后自动点掉标题画面的 START，省得人手点。正式游玩保持关闭。
# Setting type: Boolean
# Default value: false
自动开始游戏 = false

## 测试用：开启 Naninovel 自动播放，让剧情自己往下走，不依赖任何模拟点击。正式游玩保持关闭。
# Setting type: Boolean
# Default value: false
自动推进剧情 = false

[QTE]

## 烤箱那段 QTE 是纯视觉反应按键（无节奏音、按钮自行出现消失），
## 而且得分低于 60% 会无限重来。对盲人玩家来说没有可玩的通道，
## 所以默认自动点掉每一个出现的按钮，保证满分通过、剧情继续。
# Setting type: Boolean
# Default value: true
自动通过 = true

