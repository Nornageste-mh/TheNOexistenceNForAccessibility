## 加载时念一句「正在加载。」
## 读屏玩家在加载期间完全不知道游戏在干什么 —— 没画面可看、没声音可听，
## 很容易以为卡死了然后去乱按。
## 两条通路都认：Naninovel 的 LoadingPanel，以及名字里带 load 的 Unity 场景。
## 
## 这句会**打断**正在念的台词 —— 它回答的正是「为什么现在没反应」，
## 晚说几秒就失去意义了。被它打断的那句可以按「重读键」翻回来。
# Setting type: Boolean
# Default value: true
朗读「正在加载」 = true

## 只在「新台词打断上一句」关掉（=启用排队）时才有意义。
## 排队时空队列里还压着上一句，而这一句要放角色语音，两者会叠在一起、
## 两边都听不清，所以默认为角色语音让路。
## 
## 打断模式（默认）下不存在队列，这一项不起作用 ——
## 那种情况下「有配音就 Speech.Stop()」是 TransparentHer 的原始行为。
# Setting type: Boolean
# Default value: true
撞上配音时清空待读队列 = true


