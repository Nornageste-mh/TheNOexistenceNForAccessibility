## ★ 剧透闸门，强烈建议保持开启。
## RevealableText 是复用的，游戏会在面板还没显示时就把文本写进去
## （载入存档 / 加载场景 / 预载剧本都会）。只挂 set_Text 的话，
## 这些玩家根本看不到的文本会被念出来 —— 实测在 load 场景念出过结局文本。
## 开启后只朗读同时收到「开始打印」事件的行。
# Setting type: Boolean
# Default value: true
只朗读正在显示的行 = true

## ★ 逗号分隔的路径片段。命中这些面板的文本，**没有「开始打印」事件也朗读**。
## 
## 为什么需要这条：本作有一部分正文不是走对话打印器的 ——
## 设置界面里那些随光标变化的解说文字就是直接写进一个 RevealableText 的，
## Naninovel 的 OnPrintTextStarted 根本不会触发。只挂打印事件的话，
## 这些字会被上面那道剧透闸门一律拦掉：实测在设置界面里
## 「欢迎来到——莉莉丝的设置界面~」这类文字被静默丢弃（日志：REVEAL 拦下）。
## 
## 放行的前提仍然是**面板此刻确实可见**（第二道闸门照旧生效），
## 所以「藏在隐藏面板里的预载文本」这条老路堵着，不构成剧透风险。
## 留空可停用。
# Setting type: String
# Default value: SettingsUI
不经过打印器也朗读的面板 = SettingsUI

