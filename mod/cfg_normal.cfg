[QTE]

## 烤箱那段的 QTE 是纯视觉反应按键：按钮散落在屏幕上、超时就消失，
## 正确选项加「修正值」、错误选项点了无事发生，低于阈值要重来。
## 画面上没有任何可听的线索，盲人玩家没有可玩的通道。
## 
## ★ 默认关闭。自动通过是「替你操作」，会破坏这一段的沉浸感，
## 也会让想看修正值上限的玩家失去选择权 —— 要不要用由你决定。
## 正确的用法：先听游戏播报「反应环节。按 F3 可以自动通过。」，
## 想跳过这一段时自己按下 F3。
## 
## 打开后：出现按钮就代你点一遍（错误选项没有扣分，所以结果上严格
## 优于什么都不点）。采集范围严格限制在 QTE 面板子树内，不会误碰别处按钮。
