## 剧情里「打开笔记本」那一段。
## 
## ★ 它也不是对话：剧本里是 `@FakeBackLog` 命令把游戏的**假回想面板**
## （BacklogFakeUI / BackLogFakePanel）摊开，一条条列着故事已经发生的句子，
## 既没有打印事件、也不是 RevealableText —— 只挂打印器的话这一段同样一个字都不念
## （玩家报告的原话是「笔记本还是没有朗读」）。
## 开启后按画面节奏念，滚进可见区的每条念一次。
# Setting type: Boolean
# Default value: true
朗读笔记本（假回想） = true

## 剧情里翻开的笔记本是**图片**（剧本用 `@ModifyBackground diary1`~diary4 把整页纸
## 换上来），纸页上的手写字**不在游戏数据里**：实测把 4945 个文本对象逐个扫、
## 再把两个数据文件按原始字节扫（417MB + 2142MB），特征短语 0 命中 —— 字是画进图里的，
## **任何读文本的钩子都拿不到**。
## 
## 所以这里只做一件诚实的事：翻到笔记本页时念一句「笔记本图像」，
## 让你知道画面上出现了一张图、以及为什么读屏不出声。
## **纸页内容请用读屏软件的 OCR 功能看**（NVDA 装 OCR 插件后对着屏幕按一下即可）。
## 
## 补丁不会把纸页原文抄进来当查表 —— 那是游戏的美术与文本。
# Setting type: Boolean
# Default value: true
播报「笔记本图像」 = true

## ★ 逗号分隔的关键词。**说话人名（或游戏里的说话人 id）里含这些词的行，一律当成有配音**：
## 只放游戏语音、不再用 TTS 念文本。
## 
## 为什么要有这一条（作者定的『暴力』口径）：配音白名单是按**行号**对的，
## 难免有漏 —— 漏一条的表现就是『这一句明明有语音，读屏却又念了一遍』。
## 按**人**过滤不会漏：本作有配音的就是莉莉丝（含她的各种名号）与 ???，
## 配角 / 道具（书桌、低筋面粉……）都没有配音，照念。
## 
## 代价：万一某句其实**没有**配音却被当成有配音，这句就完全不朗读了（也不进重读缓冲）——
## 所以名单只放确实有配音的说话人；拿不准就留空，退回只按行号白名单判断。
# Setting type: String
# Default value: 莉莉丝,???
按说话人当成有配音 = 莉莉丝,???

