## ★ 这就是实际生效的那个旋钮。
## 
## 修正值取决于点击时按钮的凝实程度：刚露头就点只有 50%，
## 等按钮渐显到最实再点能到 97%。所以自动通过会等一会儿再点。
## 
## 实测（v0.0.0.4 日志）：按钮的渐隐不是靠 CanvasGroup / Image.color.a 做的，
## 补丁读不到 alpha 变化，所以「按峰值点」那条路 100 次里只触发了 1 次 ——
## 真正起作用的就是这个延迟。
## 1.0 秒 = 97%。想冲 100% 可以试 1.2~1.5，但调太大有漏点的风险。
